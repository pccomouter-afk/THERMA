<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — THERMA</title>
<meta name="description" content="Buat akun THERMA untuk menyimpan preferensi dan mengelola profil.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b7de8e'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='%230b0f0d'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="register">
<a href="#main" class="skip-link">Lompat ke konten</a>
<div id="navbar-slot"></div>
<main id="main">
<div class="auth-wrap">
<div class="auth-card reveal">
<h1>Buat akun.</h1>
<p class="lede">Satu akun untuk preferensi peta dan profil di peramban ini.</p>
<form data-register-form novalidate>
<div class="field">
<label for="reg-name">Nama</label>
<input id="reg-name" type="text" placeholder="Nama lengkap" autocomplete="name" required>
<p class="field-error" data-err="name"></p>
</div>
<div class="field">
<label for="reg-email">Email</label>
<input id="reg-email" type="email" placeholder="nama@email.com" autocomplete="email" required>
<p class="field-error" data-err="email"></p>
</div>
<div class="field">
<label for="reg-password">Kata sandi</label>
<input id="reg-password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password" required>
<p class="field-error" data-err="password"></p>
</div>
<div class="field">
<label for="reg-confirm">Konfirmasi kata sandi</label>
<input id="reg-confirm" type="password" placeholder="Ulangi kata sandi" autocomplete="new-password" required>
<p class="field-error" data-err="confirm"></p>
</div>
<p class="form-status" data-form-status role="status"></p>
<button type="submit" class="btn btn-primary" style="justify-content:center" data-submit>Daftar</button>
</form>
<p class="auth-switch">Sudah punya akun? <a href="/pages/login.html">Masuk</a></p>
</div>
</div>
</main>
<div id="footer-slot"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/components.js"></script>
<script src="/js/navigation.js"></script>
<script src="/js/animations.js"></script>
<script src="/js/authPages.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
