<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — THERMA</title>
<meta name="description" content="Masuk ke akun THERMA untuk menyimpan preferensi dan mengelola profil.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b7de8e'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='%230b0f0d'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="login">
<a href="#main" class="skip-link">Lompat ke konten</a>
<div id="navbar-slot"></div>
<main id="main">
<div class="auth-wrap">
<div class="auth-card reveal">
<h1>Masuk.</h1>
<p class="lede">Kelola preferensi peta dan profilmu. Data akun tersimpan lokal di peramban ini.</p>
<form data-login-form novalidate>
<div class="field">
<label for="login-email">Email</label>
<input id="login-email" type="email" placeholder="nama@email.com" autocomplete="email" required>
<p class="field-error" data-err="email"></p>
</div>
<div class="field">
<label for="login-password">Kata sandi</label>
<input id="login-password" type="password" placeholder="Minimal 8 karakter" autocomplete="current-password" required>
<p class="field-error" data-err="password"></p>
</div>
<p class="form-status" data-form-status role="status"></p>
<button type="submit" class="btn btn-primary" style="justify-content:center" data-submit>Masuk</button>
</form>
<p class="auth-switch">Belum punya akun? <a href="/pages/register.html">Daftar dulu</a></p>
</div>
</div>
</main>
<div id="footer-slot"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/components.js"></script>
<script src="/js/navigation.js"></script>
<script src="/js/animations.js"></script>
<script src="/js/authPages.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
